[tools]
hugo-extended = "v0.168.0"
lychee = "0.24.2"
python = "3.14"

[vars]
build_dir = "public"
github_repository = "waldorfkn/website"
github_workflow_file = "hugo.yaml"

[tasks.cleanup]
description = "Clean up the build destination directory"
run = "rm -r {{vars.build_dir}} || true"

[tasks.build]
depends = ["cleanup"]
description = "Build the static site using Hugo"
run = "hugo -d {{vars.build_dir}}"

[tasks.build-root]
depends = ["cleanup"]
description = "Build the static site using Hugo, not using subdirectory as baseURL"
run = "hugo --baseURL / -d {{vars.build_dir}}"

[tasks.preview]
depends = ["cleanup"]
description = "Preview the site locally using Hugo's built-in server"
run = "hugo server"

[tasks.linkcheck]
depends = ["build-root"]
description = "Check for broken links using lychee"
run = '''
lychee \
  --max-concurrency 5 --cache --max-cache-age 1h \
  --include-fragments --index-files 'index.html' \
  --exclude sncf.com --exclude matrix.to --exclude www.linkedin.com --exclude unsplash.com --exclude oncf.ma \
  --root-dir {{vars.build_dir}}/ \
  -u 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Apple WebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' \
  {{vars.build_dir}}/
'''

[tasks.events-uptodate]
description = "Exit 0 if all events' upcoming/past status is already reflected by the last successful scheduled build, exit 1 if a rebuild is needed (used to skip unnecessary nightly rebuilds)"
env.GITHUB_REPOSITORY = "{{vars.github_repository}}"
env.GITHUB_WORKFLOW_FILE = "{{vars.github_workflow_file}}"
run = "python3 scripts/events_uptodate.py"
